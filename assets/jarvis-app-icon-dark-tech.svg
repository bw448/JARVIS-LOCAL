<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="JARVIS LOCAL dark technology app icon">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#1a1e18"/>
      <stop offset="0.46" stop-color="#10130f"/>
      <stop offset="1" stop-color="#070907"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10140f"/>
      <stop offset="1" stop-color="#020302"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7ff73"/>
      <stop offset="0.48" stop-color="#baff38"/>
      <stop offset="1" stop-color="#8fdc1e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d72d5"/>
      <stop offset="0.5" stop-color="#8b94ff"/>
      <stop offset="1" stop-color="#666ccd"/>
    </linearGradient>
    <linearGradient id="corner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ec"/>
      <stop offset="1" stop-color="#afb5ab"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.12" r="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".075"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="plate-shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#000000" flood-opacity=".62"/>
    </filter>
    <filter id="signal-depth" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="3" flood-color="#000000" flood-opacity=".88"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#baff38" flood-opacity=".18"/>
    </filter>
    <filter id="rail-depth" x="-25%" y="-120%" width="150%" height="340%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity=".85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8b94ff" flood-opacity=".12"/>
    </filter>
  </defs>

  <g filter="url(#plate-shadow)">
    <rect x="80" y="100" width="864" height="864" rx="216" fill="url(#edge)"/>
    <rect x="80" y="72" width="864" height="864" rx="216" fill="url(#plate)"/>
    <rect x="86" y="78" width="852" height="852" rx="210" fill="none" stroke="#f4fff3" stroke-opacity=".09" stroke-width="3"/>
    <rect x="80" y="72" width="864" height="864" rx="216" fill="url(#sheen)"/>
  </g>

  <g transform="translate(80 72) scale(13.5)">
    <path d="M13 16h38M13 48h38" fill="none" stroke="#252840" stroke-width="2" opacity=".9" transform="translate(0 0.55)"/>
    <path d="M13 16h38M13 48h38" fill="none" stroke="url(#rail)" stroke-width="2" opacity=".82" filter="url(#rail-depth)"/>

    <path d="M13 32h7l4-10 7 22 6-18 4 6h10" fill="none" stroke="#40590f" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" transform="translate(0 0.62)"/>
    <path d="M13 32h7l4-10 7 22 6-18 4 6h10" fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" filter="url(#signal-depth)"/>
    <path d="M13 32h7l4-10 7 22 6-18 4 6h10" fill="none" stroke="#efffc4" stroke-width=".45" stroke-linecap="square" stroke-linejoin="miter" opacity=".55"/>

    <path d="M48 11h5v5M16 53h-5v-5" fill="none" stroke="#60655d" stroke-width="2" transform="translate(0 .45)"/>
    <path d="M48 11h5v5M16 53h-5v-5" fill="none" stroke="url(#corner)" stroke-width="2"/>
  </g>
</svg>
