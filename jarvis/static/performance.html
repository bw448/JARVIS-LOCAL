<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JARVIS 性能监控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
            background: #0a0e14; 
            color: #e0e0e0; 
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            color: #00d4ff; 
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
        }
        .card h2 {
            color: #00d4ff;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .stat:last-child { border-bottom: none; }
        .stat-label { color: #8da9b1; font-size: 12px; }
        .stat-value { 
            color: #00d4ff; 
            font-weight: 600;
            font-family: "Cascadia Mono", monospace;
        }
        .stat-value.good { color: #00ff88; }
        .stat-value.warning { color: #ffaa00; }
        .stat-value.error { color: #ff4444; }
        .progress-bar {
            height: 6px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }
        .btn.danger {
            border-color: rgba(255, 68, 68, 0.3);
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }
        .btn.danger:hover {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }
        .refresh-indicator {
            color: #8da9b1;
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ JARVIS 性能监控</h1>
        
        <div class="grid">
            <div class="card">
                <h2>🎵 TTS缓存</h2>
                <div class="stat">
                    <span class="stat-label">缓存条目</span>
                    <span class="stat-value" id="cache-entries">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">缓存大小</span>
                    <span class="stat-value" id="cache-size">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">命中次数</span>
                    <span class="stat-value good" id="cache-hits">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">未命中次数</span>
                    <span class="stat-value" id="cache-misses">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">命中率</span>
                    <span class="stat-value" id="cache-hit-rate">-</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cache-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>⏱️ TTS性能</h2>
                <div class="stat">
                    <span class="stat-label">平均耗时</span>
                    <span class="stat-value" id="tts-avg">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">采样数</span>
                    <span class="stat-value" id="tts-samples">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">P95耗时</span>
                    <span class="stat-value" id="tts-p95">-</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="tts-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>🎤 STT性能</h2>
                <div class="stat">
                    <span class="stat-label">平均耗时</span>
                    <span class="stat-value" id="stt-avg">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">采样数</span>
                    <span class="stat-value" id="stt-samples">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">P95耗时</span>
                    <span class="stat-value" id="stt-p95">-</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="stt-progress" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn" onclick="refreshStats()">🔄 刷新统计</button>
            <button class="btn danger" onclick="clearCache()">🗑️ 清空缓存</button>
        </div>
        
        <div class="refresh-indicator">
            自动刷新：每5秒 | 上次更新：<span id="last-update">-</span>
        </div>
    </div>
    
    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/performance');
                const data = await response.json();
                updateDisplay(data);
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('获取性能数据失败:', error);
            }
        }
        
        function updateDisplay(data) {
            // TTS缓存
            const cache = data.tts_cache || {};
            document.getElementById('cache-entries').textContent = cache.entries || 0;
            document.getElementById('cache-size').textContent = `${(cache.size_mb || 0).toFixed(2)} MB`;
            document.getElementById('cache-hits').textContent = cache.hits || 0;
            document.getElementById('cache-misses').textContent = cache.misses || 0;
            
            const hitRate = cache.hit_rate || 0;
            document.getElementById('cache-hit-rate').textContent = `${(hitRate * 100).toFixed(1)}%`;
            document.getElementById('cache-progress').style.width = `${hitRate * 100}%`;
            
            // TTS性能
            const tts = data.metrics?.tts || {};
            document.getElementById('tts-avg').textContent = `${tts.avg_ms || 0} ms`;
            document.getElementById('tts-samples').textContent = tts.samples || 0;
            document.getElementById('tts-p95').textContent = `${tts.p95_ms || 0} ms`;
            
            const ttsProgress = Math.min(100, (tts.avg_ms || 0) / 2); // 200ms为基准
            document.getElementById('tts-progress').style.width = `${ttsProgress}%`;
            
            // STT性能
            const stt = data.metrics?.stt || {};
            document.getElementById('stt-avg').textContent = `${stt.avg_ms || 0} ms`;
            document.getElementById('stt-samples').textContent = stt.samples || 0;
            document.getElementById('stt-p95').textContent = `${stt.p95_ms || 0} ms`;
            
            const sttProgress = Math.min(100, (stt.avg_ms || 0) / 3); // 300ms为基准
            document.getElementById('stt-progress').style.width = `${sttProgress}%`;
        }
        
        async function clearCache() {
            if (!confirm('确定要清空TTS缓存吗？')) return;
            
            try {
                await fetch('/api/performance/clear-cache');
                refreshStats();
            } catch (error) {
                console.error('清空缓存失败:', error);
            }
        }
        
        function refreshStats() {
            fetchStats();
        }
        
        // 自动刷新
        setInterval(fetchStats, 5000);
        
        // 初始加载
        fetchStats();
    </script>
</body>
</html>
